<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Iron Log"/>
<meta name="theme-color" content="#0A0A0A"/>
<title>Iron Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--a:#E8FF47;--b:#47CFFF;--p:#FF47B8;--g:#47FF8A;--bg:#0A0A0A;--card:#111;--border:#1E1E1E;--muted:#555;--text:#F0F0F0}
html,body{background:var(--bg);color:var(--text);font-family:'DM Mono','Courier New',monospace;min-height:100vh;overscroll-behavior:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
#app{padding-bottom:80px}
/* HEADER */
#header{padding:max(env(safe-area-inset-top),24px) 18px 12px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:40}
.logo{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.05em;color:var(--a);line-height:1}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:.14em;margin-top:2px}
.week-strip{display:flex;gap:5px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.week-day{flex:0 0 auto;text-align:center;min-width:40px}
.week-label{font-size:8px;color:var(--muted);margin-bottom:3px;letter-spacing:.08em}
.week-pill{padding:4px 5px;border-radius:4px;font-size:8px;white-space:nowrap;border:1px solid transparent}
/* NAV */
#nav{position:fixed;bottom:0;left:0;right:0;background:#0D0D0D;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:4px 0 max(env(safe-area-inset-bottom),8px);z-index:50}
.nav-btn{background:none;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:8px 6px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-btn.active{color:var(--a)}
.nav-icon{font-size:17px}
.nav-label{font-size:8px}
/* CONTENT */
.tab{display:none;padding:16px 18px}
.tab.active{display:block}
/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
/* BUTTONS */
.btn{border:none;cursor:pointer;font-family:'DM Mono',monospace;font-weight:500;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:9px 18px;font-size:11px}
.btn-full{width:100%;padding:14px;font-size:13px;letter-spacing:.12em;border-radius:6px;margin-top:20px;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-weight:500;text-transform:uppercase}
.btn-accent{background:var(--a);color:#000}
.btn-cardio{background:var(--b);color:#000}
.btn-pink{background:var(--p);color:#000}
/* FILTER */
.filter-row{display:flex;gap:7px;margin-bottom:18px}
.filter-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:100px;cursor:pointer}
.filter-btn.active-all{border-color:var(--text);color:var(--text)}
.filter-btn.active-strength{border-color:var(--a);color:var(--a)}
.filter-btn.active-cardio{border-color:var(--b);color:var(--b)}
/* PLAN CARDS */
.plan-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px;cursor:pointer}
.plan-title{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1.1}
.plan-meta{font-size:10px;color:var(--muted);margin-top:2px}
.plan-header{display:flex;justify-content:space-between;align-items:flex-start}
.plan-chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:9px;color:var(--muted);background:#161616;padding:3px 7px;border-radius:3px}
.tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:9px;letter-spacing:.1em;margin-bottom:5px}
.goal-box{border-radius:6px;padding:10px 12px;font-size:11px;line-height:1.6;margin-top:12px}
.ex-list{margin-top:12px;display:flex;flex-direction:column;gap:5px}
.ex-row{display:flex;justify-content:space-between;padding:8px 10px;background:#161616;border-radius:4px}
.ex-name{font-size:11px}
.ex-note{font-size:9px;color:var(--muted);margin-top:2px}
.ex-reps{font-size:10px;white-space:nowrap;margin-left:10px}
/* LOG */
.set-grid{display:grid;grid-template-columns:1fr 72px 72px 36px;gap:6px;align-items:center;margin-bottom:6px}
.set-label{font-size:9px;color:var(--muted)}
.done-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);background:none;cursor:pointer;font-size:13px;color:transparent;flex-shrink:0}
.done-btn.done{color:#000}
/* INPUTS */
input,select{background:#161616;border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;border-radius:4px;padding:7px 10px;outline:none;width:100%;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--a)}
select option{background:#161616}
/* NUTRITION */
.day-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.day-tab{background:none;border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:9px;padding:5px 2px;border-radius:4px;cursor:pointer;text-align:center;width:100%}
.day-tab.active{border-color:var(--a);color:var(--a)}
.day-tab.has-data{border-color:#47FF8A66;color:var(--g)}
.macro-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.macro-val{font-size:16px;font-family:'Bebas Neue',sans-serif}
.macro-lbl{font-size:8px;color:var(--muted)}
.macro-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px}
.macro-fill{height:100%;border-radius:2px;transition:width .3s}
.food-entry{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:#161616;border-radius:5px;margin-bottom:4px}
.rm-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;padding:0 4px;line-height:1}
.rm-btn:hover{color:#ff4747}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.form-label{font-size:8px;letter-spacing:.08em;margin-bottom:3px}
/* PROGRESS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
.stat-val{font-size:24px;font-family:'Bebas Neue',sans-serif}
.stat-lbl{font-size:8px;color:var(--muted);letter-spacing:.1em}
.goal-card{background:#0A100A;border:1px solid #47FF8A33;border-radius:8px;padding:16px;margin-bottom:18px}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal-val{font-size:18px;font-family:'Bebas Neue',sans-serif}
.goal-lbl{font-size:9px;color:var(--muted)}
.targets-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.target-box{padding:10px 12px;background:#161616;border-radius:5px}
.target-val{font-size:20px;font-family:'Bebas Neue',sans-serif}
.target-lbl{font-size:9px;color:var(--muted)}
/* CHART */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar-inner{width:100%;background:var(--a);border-radius:3px 3px 0 0;min-height:2px;transition:height .3s}
.bar-date{font-size:8px;color:var(--muted)}
.line-chart{position:relative;height:80px;margin-top:8px}
/* HISTORY */
.session-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.session-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:8px}
.session-name{font-size:12px}
.session-meta{font-size:10px;color:var(--muted);margin-top:2px;padding-left:14px}
/* TOAST */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--a);color:#000;padding:10px 24px;border-radius:100px;font-size:12px;font-weight:500;z-index:200;white-space:nowrap;display:none;animation:fU .3s ease}
@keyframes fU{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.section-label{font-size:10px;color:var(--muted);letter-spacing:.15em;margin-bottom:16px}
.info-box{border-radius:6px;padding:10px 12px;font-size:11px;line-height:1.6;margin-bottom:14px}
.bw-row{display:flex;gap:8px;margin-bottom:12px}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div><div class="logo">IRON LOG</div><div class="logo-sub">5-DAY HYBRID ATHLETE</div></div>
      <div style="text-align:right"><div class="stat-val" id="total-sessions" style="font-size:20px">0</div><div style="font-size:8px;color:var(--muted);letter-spacing:.1em">SESSIONS</div></div>
    </div>
    <div class="week-strip" id="week-strip"></div>
  </div>

  <div id="tab-plan" class="tab active"></div>
  <div id="tab-log" class="tab"></div>
  <div id="tab-nutrition" class="tab"></div>
  <div id="tab-progress" class="tab"></div>
</div>

<div id="nav">
  <button class="nav-btn active" data-tab="plan"><span class="nav-icon">📋</span><span class="nav-label">Plan</span></button>
  <button class="nav-btn" data-tab="log"><span class="nav-icon">⚡</span><span class="nav-label">Log</span></button>
  <button class="nav-btn" data-tab="nutrition"><span class="nav-icon">🥗</span><span class="nav-label">Food</span></button>
  <button class="nav-btn" data-tab="progress"><span class="nav-icon">📈</span><span class="nav-label">Progress</span></button>
</div>

<div id="toast"></div>

<script>
const WARMUPS = {
  "Push":{color:"#E8FF47",steps:[
    {name:"Arm Circles",duration:"45s",notes:"Forward + backward. Loosen shoulder capsule before any pressing."},
    {name:"Band Pull-Aparts",duration:"20 reps",notes:"Or substitute light face pulls. Sets scapula, activates rear delt."},
    {name:"Incline Pushups",duration:"15 reps",notes:"Slow and controlled. Warm up pec + shoulder joint through pressing ROM."},
    {name:"Empty Bar Bench",duration:"15 reps",notes:"Focus on bar path, wrist position, lat engagement. Bar at base of palm."},
    {name:"Shoulder CARs",duration:"5/side",notes:"Controlled articular rotations — slow full circles with arm. Joint prep."},
    {name:"40% Working Weight x8",duration:"1 set",notes:"Feel the movement. Check grip width against center knurling."},
  ]},
  "Pull":{color:"#E8FF47",steps:[
    {name:"Cat-Cow",duration:"10 reps",notes:"Slow. Warms up the entire spine before deadlifting."},
    {name:"Hip Hinge with Dowel",duration:"10 reps",notes:"Or broomstick. Practice the hinge pattern — hips back, not down."},
    {name:"Glute Bridges",duration:"15 reps",notes:"2s pause at top. Activates glutes before deadlift so lower back doesn't compensate."},
    {name:"Dead Hang",duration:"30s",notes:"Decompress the spine. Also warms up grip and lats for pull-ups."},
    {name:"Scapular Pull-ups",duration:"10 reps",notes:"Arms straight, just depress and retract shoulder blades. Lat activation."},
    {name:"40% Deadlift x5",duration:"1 set",notes:"Feel the bar drag your shins. Lats tight, proud chest, hips and shoulders rise together."},
  ]},
  "Legs":{color:"#E8FF47",steps:[
    {name:"Hip 90/90 Switches",duration:"5/side",notes:"Sit on floor, both legs at 90°, rotate side to side. Opens hip internal/external rotation."},
    {name:"Deep Squat Hold",duration:"60s",notes:"Hold something for balance. Let hips settle. Tells your CNS where you're going."},
    {name:"Ankle Circles + Calf Raises",duration:"10+15 reps",notes:"Full ROM calf raises. Ankle mobility is the #1 limiter of squat depth."},
    {name:"Lateral Band Walks",duration:"15 steps/side",notes:"Band above knees. Activates glute medius — prevents knee cave in squats."},
    {name:"World's Greatest Stretch",duration:"5/side",notes:"Lunge + rotate arm to ceiling. Hits hip flexors, t-spine, groin simultaneously."},
    {name:"Bar Only Squat x10",duration:"1 set",notes:"Full depth, feel the pattern. Then ramp: 40%x8, 60%x5, 80%x3."},
  ]},
  "Cardio + Core":{color:"#47CFFF",steps:[
    {name:"Brisk Walk",duration:"2 min",notes:"Get blood flowing before running. Don't skip this even if you feel warm."},
    {name:"Leg Swings",duration:"10/side",notes:"Front-back then side-side. Holding a wall. Opens hips for running gait."},
    {name:"Hip Circles",duration:"10/side",notes:"Hands on hips, large circles. Loosens hip flexors that tighten from sitting."},
    {name:"High Knees",duration:"20 reps",notes:"Slow and deliberate. Activates hip flexors and gets heart rate climbing."},
    {name:"Glute Bridges",duration:"15 reps",notes:"Wakes up glutes before running so they actually fire during the run."},
    {name:"Easy 2 min Jog",duration:"2 min",notes:"Very easy pace. By the end of this your Zone 2 run should feel natural to step into."},
  ]},
  "Power + Athleticism":{color:"#FF47B8",steps:[
    {name:"Jump Rope Easy",duration:"2 min",notes:"Single unders only. Just blood flow — not a workout yet."},
    {name:"Leg Swings",duration:"10/side",notes:"Front-back + lateral. Opens hips for jumping and bounding."},
    {name:"Ankle Bounces (Pogo Hops)",duration:"20 reps",notes:"Small quick hops, balls of feet, minimal knee bend. Wakes up stretch-reflex in calves + Achilles."},
    {name:"Glute Bridges",duration:"15 reps explosive",notes:"Fast up, controlled down. Fires glutes before any jumping."},
    {name:"Box Step-ups",duration:"8/leg",notes:"Controlled. Primes box jump pattern without the impact load."},
    {name:"Submax Broad Jumps",duration:"3 reps @ 50%",notes:"Same movement, half effort. CNS rehearsal before full explosive work."},
  ]},
};

const PLANS = {
  "Push":{type:"strength",color:"#E8FF47",day:"Mon",exercises:[
    {name:"Bench Press",sets:4,reps:"6-8",rest:"3 min",notes:"Bar at base of palm — not fingers. Wrist stacked over forearm. Lats engaged, 'bend the bar.' 3s eccentric. Sets 1-2 heavier, drop 5lb for sets 3-4 if needed."},
    {name:"Incline DB Press",sets:3,reps:"8-10",rest:"2 min",notes:"Bench at 30-45°. 30° is your default — hits upper chest without front delt takeover. Full stretch at bottom, 3s down."},
    {name:"Pec Deck / Cable Fly",sets:3,reps:"12-15",rest:"90s",notes:"Pec deck: seat so elbows at chest height, use forearm pads. Cable fly: cables at floor level, split stance, slight forward lean. Squeeze 1s at peak, 3s eccentric."},
    {name:"Overhead Press",sets:3,reps:"8-10",rest:"2 min",notes:"Brace core like taking a punch. Bar from front rack to full extension. No lumbar hyperextension at top."},
    {name:"Lateral Raises",sets:4,reps:"15-20",rest:"60s",notes:"Life Fitness machine preferred over dumbbells — constant tension through full arc. Elbows at chest height on seat adjustment. No momentum."},
    {name:"Tricep Pushdown",sets:3,reps:"12-15",rest:"60s",notes:"Rope preferred. If unavailable use Life Fitness tricep extension machine — align elbows with pivot point on seat. Upper arms pinned, full extension, 2s eccentric."},
  ]},
  "Pull":{type:"strength",color:"#E8FF47",day:"Tue",exercises:[
    {name:"Deadlift",sets:3,reps:"5",rest:"3 min",notes:"Bar over mid-foot, 1 inch from shins. Hip hinge down to grip — don't squat to bar. Push floor away, hips and shoulders rise together. 3s eccentric on working sets. RPE 8 only."},
    {name:"Weighted Pull-ups",sets:4,reps:"6-8",rest:"2-3 min",notes:"Full hang at bottom, chin over bar at top. 3s down — this is where the growth is. Don't kip. Add weight when you can hit 8 clean reps."},
    {name:"Cable Row",sets:3,reps:"10-12",rest:"2 min",notes:"V-bar neutral grip (palms facing each other). Chest to pad, full stretch at front — let shoulder blades protract. Drive elbows back, retract hard at end. Don't rock torso."},
    {name:"Face Pulls",sets:3,reps:"15-20",rest:"60s",notes:"Cable at face height. Pull to ears, external rotate at end — thumbs pointing behind you. Rear delt + rotator cuff health. Never skip this."},
    {name:"Hammer Curls",sets:3,reps:"10-12",rest:"90s",notes:"SINGLE ARM, ALTERNATING. Neutral grip (thumb up) throughout — don't rotate to standard curl. Elbow pinned to side, straight up not across chest. 2-3s eccentric."},
    {name:"Incline DB Curl",sets:3,reps:"12-15",rest:"90s",notes:"TWO ARMS. Bench at 45-60°. Arms hang fully behind torso — that stretch is the point. Don't let elbows drift forward. Slow at bottom, feel the load before curling."},
  ]},
  "Legs":{type:"strength",color:"#E8FF47",day:"Thu",exercises:[
    {name:"Squat",sets:4,reps:"6-8",rest:"3 min",notes:"Feet hip-width, toes slightly out. Below parallel. Brace before unracking — stay braced all the way up. Knees track over toes, no cave. 3s down."},
    {name:"Romanian Deadlift",sets:3,reps:"10-12",rest:"2 min",notes:"Hip hinge — hips back toward wall, not down. Bar/bells drag down your legs. 3s eccentric. Feel hamstring load at bottom. If using kettlebells, keep them close to legs, fight forward drift."},
    {name:"Leg Press",sets:3,reps:"12-15",rest:"2 min",notes:"High and wide foot placement — emphasizes glutes and hamstrings. Don't lock knees at top. Full ROM, don't cut depth short."},
    {name:"Walking Lunges",sets:3,reps:"12/leg",rest:"90s",notes:"Drive through front heel to stand. Back knee close to floor. Torso upright, don't lean forward. Step length long enough that front shin is vertical at bottom."},
    {name:"Leg Curl",sets:3,reps:"12-15",rest:"90s",notes:"Lying preferred. Full extension at start — don't start half-curled. Squeeze hard at top, 2s eccentric. Hips stay on pad throughout."},
    {name:"Calf Raises",sets:4,reps:"15-20",rest:"60s",notes:"Full ROM — pause at stretch at bottom, hold 1s at peak contraction. Don't bounce through reps. Outside calf soreness after this day is normal — peroneals working correctly."},
  ]},
  "Cardio + Core":{type:"cardio",color:"#47CFFF",day:"Wed",tag:"FAT LOSS + ABS",duration:"45-50 min",
    goal:"Zone 2 run builds fat oxidation — this is how body fat actually comes off. Core directly after is more effective when fatigued. Target 10:30-11:00/km, fully conversational. HR 130-150.",
    exercises:[
      {name:"Zone 2 Run",sets:1,reps:"25-30 min",notes:"HR 130-150. Fully conversational pace. If you can't speak in full sentences, slow down. Brooks Adrenaline GTS is your shoe for this."},
      {name:"Hanging Leg Raises",sets:4,reps:"12-15",rest:"60s",notes:"Posterior pelvic tilt before lifting — tuck pelvis under. No swinging. Control the descent."},
      {name:"Cable Crunch",sets:3,reps:"15-20",rest:"60s",notes:"Round the spine — don't just lean forward. The curl of the spine is what contracts the abs. Rope at forehead height."},
      {name:"Ab Wheel Rollout",sets:3,reps:"8-10",rest:"90s",notes:"Brace hard before rolling out. Control the negative — don't collapse. Stop before lower back arches."},
      {name:"Plank",sets:3,reps:"45-60s",rest:"45s",notes:"Posterior pelvic tilt — squeeze glutes and tuck pelvis. Don't let hips sag or pike. Breathe normally."},
      {name:"Oblique Twists",sets:3,reps:"15/side",rest:"60s",notes:"Loaded with cable or plate if possible. Rotate, don't just tilt. Full rotation through the torso."},
  ]},
  "Power + Athleticism":{type:"cardio",color:"#FF47B8",day:"Fri",tag:"ATHLETIC CONDITIONING",duration:"35-40 min",
    goal:"Explosive power, jump rope conditioning, functional movement. High EPOC burns calories for hours after. All plyo work comes FIRST while CNS is fresh. Rest 2-3 min between plyo sets.",
    exercises:[
      {name:"Box Jumps",sets:4,reps:"8",rest:"2-3 min",notes:"Full hip extension at top — don't just land on box crouched. Land soft with bent knees. Step down, don't jump down. Cross trainers or PWR Nitro Squared."},
      {name:"Broad Jumps",sets:4,reps:"6",rest:"2-3 min",notes:"Max horizontal distance. Swing arms for momentum. Stick the landing — absorb force through bent knees. Pause 2s before next rep."},
      {name:"Lateral Bounds",sets:3,reps:"10/side",rest:"90s",notes:"Single-leg takeoff AND landing. Absorb force at knee on landing — don't let knee cave. This is why it comes BEFORE jump rope, not after."},
      {name:"Jump Rope HIIT",sets:8,reps:"40s on / 20s off",notes:"Double unders or fast singles. Max effort on the 40s. Outside calf soreness after is normal — peroneals working."},
      {name:"Rest",sets:1,reps:"2-3 min",notes:"Full recovery before Tabata. HR should drop below 120 bpm. Use your Garmin to check. Don't shortcut this."},
      {name:"Jump Rope Tabata",sets:4,reps:"20s on / 10s off",notes:"All-out every interval. If you can't go hard on all 4 rounds you didn't rest enough before starting."},
  ]},
};

const SPLIT=[
  {day:"Mon",workout:"Push",type:"strength"},
  {day:"Tue",workout:"Pull",type:"strength"},
  {day:"Wed",workout:"Cardio + Core",type:"cardio"},
  {day:"Thu",workout:"Legs",type:"strength"},
  {day:"Fri",workout:"Power + Athleticism",type:"cardio"},
  {day:"Sat",workout:"Yoga / Recovery",type:"recovery"},
  {day:"Sun",workout:"Rest",type:"rest"},
];

const TARGETS={calories:2250,protein:180,carbs:210,fat:60};
const FOOD_DAYS=(()=>{
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date("2026-06-09T12:00:00");
    d.setDate(d.getDate()+i);
    days.push(d.toISOString().split("T")[0]);
  }
  return days;
})();

const TYPE_COLOR={strength:"#E8FF47",cardio:"#47CFFF",recovery:"#47FF8A",rest:"#555"};
const DAY_NAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// STATE
let state={
  tab:"plan",
  logs:{},
  bodyweight:[],
  foodLogs:{},
  activeWorkout:null,
  sessionSets:{},
  planView:"all",
  expandedPlan:null,
  selFoodDay:FOOD_DAYS[0],
  foodEntry:{meal:"Breakfast",food:"",calories:"",protein:"",carbs:"",fat:""},
  bwInput:"",
};

function load(){
  try{
    const r=localStorage.getItem("ironlog-v3");
    if(r){const d=JSON.parse(r);state.logs=d.logs||{};state.bodyweight=d.bodyweight||[];state.foodLogs=d.foodLogs||{};}
  }catch(e){}
}

function save(){
  try{localStorage.setItem("ironlog-v3",JSON.stringify({logs:state.logs,bodyweight:state.bodyweight,foodLogs:state.foodLogs}));}catch(e){}
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.display="block";
  setTimeout(()=>{t.style.display="none";},2500);
}

function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(el=>el.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("active");
  document.querySelector(`.nav-btn[data-tab="${tab}"]`).classList.add("active");
  render();
}

function dayTotals(day){
  return (state.foodLogs[day]||[]).reduce((a,e)=>({
    calories:a.calories+e.calories,protein:a.protein+e.protein,
    carbs:a.carbs+e.carbs,fat:a.fat+e.fat
  }),{calories:0,protein:0,carbs:0,fat:0});
}

// RENDER FUNCTIONS
function renderWeekStrip(){
  const el=document.getElementById("week-strip");
  el.innerHTML=SPLIT.map(({day,workout,type})=>{
    const col=TYPE_COLOR[type]||"#555";
    const isOff=type==="rest";
    return `<div class="week-day">
      <div class="week-label">${day}</div>
      <div class="week-pill" style="background:${isOff?"transparent":"#181818"};border-color:${isOff?"#1E1E1E":col+"44"};color:${isOff?"#555":col}">
        ${isOff?"—":workout.split(" ")[0]}
      </div>
    </div>`;
  }).join("");
  document.getElementById("total-sessions").textContent=Object.keys(state.logs).length;
}

function renderWarmup(name,col){
  const w=WARMUPS[name];
  if(!w)return"";
  return`<div style="margin-top:14px;padding:12px;background:#0A0A0A;border:1px solid ${col}33;border-radius:6px">
    <div style="font-size:9px;color:${col};letter-spacing:.12em;margin-bottom:10px">⚡ 7-MIN WARM-UP</div>
    ${w.steps.map((s,i)=>`
      <div style="display:flex;gap:10px;margin-bottom:8px;align-items:flex-start">
        <div style="font-size:9px;color:${col};min-width:14px;margin-top:1px">${i+1}</div>
        <div style="flex:1">
          <div style="font-size:11px;color:#F0F0F0">${s.name} <span style="color:${col};font-size:10px">· ${s.duration}</span></div>
          <div style="font-size:9px;color:#555;margin-top:2px;line-height:1.4">${s.notes}</div>
        </div>
      </div>`).join("")}
  </div>`;
}

function renderPlan(){
  const el=document.getElementById("tab-plan");
  const filtered=Object.entries(PLANS).filter(([,v])=>state.planView==="all"||v.type===state.planView);
  el.innerHTML=`
    <div class="filter-row">
      <button class="filter-btn ${state.planView==="all"?"active-all":""}" onclick="setPlanView('all')">All</button>
      <button class="filter-btn ${state.planView==="strength"?"active-strength":""}" onclick="setPlanView('strength')">Strength</button>
      <button class="filter-btn ${state.planView==="cardio"?"active-cardio":""}" onclick="setPlanView('cardio')">Cardio</button>
    </div>
    ${filtered.map(([name,plan])=>{
      const isC=plan.type==="cardio";
      const col=plan.color||"#E8FF47";
      const isExp=state.expandedPlan===name;
      const exSlice=isExp?plan.exercises:plan.exercises.slice(0,4);
      return `
        <div class="plan-card" style="border-color:${isExp?col:"#1E1E1E"}" onclick="toggleExpand('${name.replace(/'/g,"\\'")}')">
          <div class="plan-header">
            <div style="flex:1">
              ${isC&&plan.tag?`<span class="tag" style="background:${col}22;color:${col}">${plan.tag}</span>`:""}
              <div class="plan-title" style="color:#F0F0F0">${name}</div>
              <div class="plan-meta">${plan.day} · ${isC?plan.duration:plan.exercises.length+" exercises"}</div>
            </div>
            <button class="btn" style="background:${col};color:#000;margin-left:10px;flex-shrink:0" onclick="event.stopPropagation();startWorkout('${name.replace(/'/g,"\\'")}')">Start</button>
          </div>
          ${isExp&&isC&&plan.goal?`<div class="goal-box" style="background:${col}12;border:1px solid ${col}30;color:${col}CC">${plan.goal}</div>`:""}
          ${isExp?`
            ${renderWarmup(name,col)}
            <div style="font-size:9px;color:#555;letter-spacing:.12em;margin:14px 0 8px">EXERCISES</div>
            <div class="ex-list">${plan.exercises.map(ex=>`
              <div class="ex-row">
                <div style="flex:1">
                  <div class="ex-name">${ex.name}</div>
                  <div class="ex-note">${ex.notes}</div>
                  ${ex.rest?`<div style="font-size:9px;color:#444;margin-top:3px">Rest: ${ex.rest}</div>`:""}
                </div>
                <div class="ex-reps" style="color:${col}">${ex.sets>1?ex.sets+"x":""}${ex.reps}</div>
              </div>`).join("")}</div>`:
            `<div class="plan-chips">
              ${exSlice.map(ex=>`<span class="chip">${ex.name}</span>`).join("")}
              ${plan.exercises.length>4?`<span style="font-size:9px;color:#555">+${plan.exercises.length-4} more</span>`:""}
            </div>`
          }
        </div>`;
    }).join("")}`;
}

function renderLog(){
  const el=document.getElementById("tab-log");
  if(!state.activeWorkout){
    el.innerHTML=`<div style="text-align:center;padding-top:60px">
      <div style="font-size:14px;color:#555">No active session.</div>
      <div style="font-size:11px;color:#555;margin-top:8px">Go to Plan to start one.</div>
    </div>`;
    return;
  }
  const plan=PLANS[state.activeWorkout];
  const isC=plan.type==="cardio";
  const col=plan.color||"#E8FF47";
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;color:${col}">${state.activeWorkout}</div>
        <div style="font-size:9px;color:#555;letter-spacing:.1em">IN PROGRESS</div>
      </div>
      <div style="width:8px;height:8px;border-radius:50%;background:${col}"></div>
    </div>
    ${isC&&plan.goal?`<div class="info-box" style="background:${col}12;border:1px solid ${col}30;color:${col}CC">🎯 ${plan.goal}</div>`:""}
    ${renderWarmup(state.activeWorkout,col)}
    <div style="font-size:9px;color:#555;letter-spacing:.12em;margin:16px 0 10px">EXERCISES</div>
    ${plan.exercises.map((ex,ei)=>`
      <div class="card">
        <div style="font-size:13px;font-weight:500;margin-bottom:2px">${ex.name}</div>
        <div style="font-size:10px;color:#555;margin-bottom:4px">${ex.sets>1?ex.sets+" sets · ":""}${ex.reps}${ex.rest?" · Rest: "+ex.rest:""}</div>
        <div style="font-size:10px;color:#444;margin-bottom:12px;line-height:1.4">${ex.notes}</div>
        ${isC?`
          <div style="display:flex;align-items:center;gap:10px">
            <button class="done-btn ${(state.sessionSets[ex.name]||[{}])[0]?.done?"done":""}"
              style="border-color:${col};${(state.sessionSets[ex.name]||[{}])[0]?.done?"background:"+col+";border-color:"+col:""}"
              onclick="toggleCardioSet('${ex.name.replace(/'/g,"\\'")}')">✓</button>
            <input type="text" placeholder="Time / distance / notes"
              value="${((state.sessionSets[ex.name]||[{}])[0]?.reps||"").replace(/"/g,"&quot;")}"
              oninput="updateCardioNote('${ex.name.replace(/'/g,"\\'")}',this.value)" style="flex:1"/>
          </div>`:`
          <div class="set-grid" style="margin-bottom:6px">
            <span class="set-label">SET</span><span class="set-label">LBS</span><span class="set-label">REPS</span><span></span>
          </div>
          ${(state.sessionSets[ex.name]||[]).map((set,si)=>`
            <div class="set-grid">
              <span style="font-size:11px;color:#555">Set ${si+1}</span>
              <input type="number" placeholder="—" value="${set.weight||""}" oninput="updateSet('${ex.name.replace(/'/g,"\\'")}',${si},'weight',this.value)"/>
              <input type="number" placeholder="—" value="${set.reps||""}" oninput="updateSet('${ex.name.replace(/'/g,"\\'")}',${si},'reps',this.value)"/>
              <button class="done-btn ${set.done?"done":""}" style="${set.done?"background:#E8FF47;border-color:#E8FF47":""}" onclick="toggleSet('${ex.name.replace(/'/g,"\\'")}',${si})">✓</button>
            </div>`).join("")}
        `}
      </div>`).join("")}
    <button class="btn-full" style="background:${col};color:#000" onclick="finishWorkout()">✓ Finish & Save Session</button>`;
}

function renderNutrition(){
  const el=document.getElementById("tab-nutrition");
  const t=dayTotals(state.selFoodDay);
  const dayName=DAY_NAMES[new Date(state.selFoodDay+"T12:00:00").getDay()];
  const entries=state.foodLogs[state.selFoodDay]||[];
  const meals=["Breakfast","Lunch","Dinner","Pre-workout","Post-workout","Snack"];

  el.innerHTML=`
    <div class="section-label">— WEEK OF JUNE 9</div>
    <div class="info-box" style="background:#47CFFF12;border:1px solid #47CFFF30;color:#47CFFFCC;margin-bottom:16px">
      Log everything you eat this week. Share with me after 7 days and I'll analyze how your diet is affecting your body comp.
    </div>
    <div class="day-tabs">
      ${FOOD_DAYS.map(d=>{
        const hasD=(state.foodLogs[d]||[]).length>0;
        const dTot=dayTotals(d);
        const dName=DAY_NAMES[new Date(d+"T12:00:00").getDay()];
        return `<button class="day-tab ${d===state.selFoodDay?"active":hasD?"has-data":""}" onclick="selFoodDay('${d}')">
          <div>${dName}</div><div style="font-size:8px;margin-top:1px">${hasD?dTot.calories:"—"}</div>
        </button>`;
      }).join("")}
    </div>
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:10px;color:#555;letter-spacing:.12em;margin-bottom:12px">${dayName} TOTALS</div>
      <div class="macro-grid">
        ${[[t.calories,TARGETS.calories,"KCAL","#F0F0F0"],[t.protein,TARGETS.protein,"PRO","#E8FF47"],[t.carbs,TARGETS.carbs,"CARB","#47CFFF"],[t.fat,TARGETS.fat,"FAT","#FF47B8"]].map(([val,target,label,col])=>`
          <div>
            <div class="macro-val" style="color:${val>=target?"#47FF8A":col}">${val}</div>
            <div class="macro-lbl">${label}/${target}</div>
            <div class="macro-bar"><div class="macro-fill" style="width:${Math.min((val/target)*100,100)}%;background:${col}"></div></div>
          </div>`).join("")}
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:10px;color:#555;letter-spacing:.12em;margin-bottom:12px">ADD FOOD</div>
      <div style="margin-bottom:8px">
        <select id="fe-meal" onchange="updateFoodEntry('meal',this.value)">
          ${meals.map(m=>`<option ${state.foodEntry.meal===m?"selected":""}>${m}</option>`).join("")}
        </select>
      </div>
      <div style="margin-bottom:8px">
        <input id="fe-food" type="text" placeholder="Food / meal description" value="${state.foodEntry.food.replace(/"/g,"&quot;")}" oninput="updateFoodEntry('food',this.value)"/>
      </div>
      <div class="form-grid">
        ${[["calories","Kcal","#F0F0F0"],["protein","Pro g","#E8FF47"],["carbs","Carb g","#47CFFF"],["fat","Fat g","#FF47B8"]].map(([f,label,col])=>`
          <div>
            <div class="form-label" style="color:${col}">${label}</div>
            <input type="number" placeholder="0" value="${state.foodEntry[f]||""}" oninput="updateFoodEntry('${f}',this.value)"/>
          </div>`).join("")}
      </div>
      <button class="btn btn-full" style="background:#E8FF47;color:#000;margin-top:0" onclick="addFood()">+ Log Food</button>
    </div>
    ${entries.length>0?`
      <div style="font-size:10px;color:#555;letter-spacing:.12em;margin-bottom:10px">LOGGED TODAY</div>
      ${meals.map(meal=>{
        const mEntries=entries.filter(e=>e.meal===meal);
        if(!mEntries.length)return"";
        return`<div style="margin-bottom:12px">
          <div style="font-size:9px;color:#555;letter-spacing:.1em;margin-bottom:6px">${meal.toUpperCase()}</div>
          ${mEntries.map(e=>`
            <div class="food-entry">
              <div style="flex:1">
                <div style="font-size:11px">${e.food}</div>
                <div style="font-size:9px;color:#555;margin-top:2px">${e.calories}kcal · ${e.protein}g P · ${e.carbs}g C · ${e.fat}g F</div>
              </div>
              <button class="rm-btn" onclick="removeFood('${state.selFoodDay}',${e.id})">×</button>
            </div>`).join("")}
        </div>`;
      }).join("")}`:""}`;
}

function renderProgress(){
  const el=document.getElementById("tab-progress");
  const total=Object.keys(state.logs).length;
  const strS=Object.values(state.logs).filter(l=>l.type==="strength").length;
  const carS=Object.values(state.logs).filter(l=>l.type==="cardio").length;
  const wkS=Object.keys(state.logs).filter(d=>(new Date()-new Date(d))/86400000<=7).length;

  // Volume chart data
  const volData=Object.entries(state.logs).filter(([,e])=>e.type==="strength").slice(-8).map(([date,entry])=>{
    let v=0;Object.values(entry.sets||{}).forEach(sets=>sets.forEach(s=>{if(s.done&&s.weight&&s.reps)v+=parseFloat(s.weight||0)*parseFloat(s.reps||0);}));
    return{date:date.slice(5),volume:Math.round(v)};
  });
  const maxVol=Math.max(...volData.map(d=>d.volume),1);

  // BW chart
  const bwData=state.bodyweight.slice(-10);
  const maxBW=Math.max(...bwData.map(d=>d.weight),1);
  const minBW=Math.min(...bwData.map(d=>d.weight),maxBW-1);
  const bwRange=maxBW-minBW||1;

  const history=Object.entries(state.logs).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8);

  el.innerHTML=`
    <div class="section-label">— OVERVIEW</div>
    <div class="stats-grid">
      ${[[wkS,"THIS WEEK","#F0F0F0"],[strS,"STRENGTH","#E8FF47"],[carS,"CARDIO","#47CFFF"]].map(([val,label,col])=>`
        <div class="stat-card"><div class="stat-val" style="color:${col}">${val}</div><div class="stat-lbl">${label}</div></div>`).join("")}
    </div>
    <div class="goal-card">
      <div style="font-size:9px;color:#47FF8A;letter-spacing:.14em;margin-bottom:10px">BODY COMPOSITION GOAL</div>
      <div class="goal-grid">
        ${[["175 lb","Current weight","#F0F0F0"],["158-162 lb","Target weight","#47FF8A"],["~18-20%","Est. body fat","#F0F0F0"],["10-12%","Target body fat","#47FF8A"]].map(([val,label,col])=>`
          <div><div class="goal-val" style="color:${col}">${val}</div><div class="goal-lbl">${label}</div></div>`).join("")}
      </div>
      <div style="margin-top:12px;padding:8px 10px;background:#0F1A0F;border-radius:5px;font-size:10px;color:#47FF8AAA;line-height:1.5">Timeline: 3-4 months at 500 kcal deficit + consistent training</div>
    </div>
    <div class="card" style="margin-bottom:18px">
      <div style="font-size:10px;color:#555;letter-spacing:.12em;margin-bottom:12px">DAILY TARGETS</div>
      <div class="targets-grid">
        ${[["2,250","Calories","#F0F0F0"],["180g","Protein","#E8FF47"],["210g","Carbs","#47CFFF"],["60g","Fat","#FF47B8"]].map(([val,label,col])=>`
          <div class="target-box"><div class="target-val" style="color:${col}">${val}</div><div class="target-lbl">${label}/day</div></div>`).join("")}
      </div>
    </div>
    ${volData.length>0?`
      <div class="card" style="margin-bottom:18px">
        <div style="font-size:10px;color:#555;letter-spacing:.12em;margin-bottom:8px">LIFT VOLUME (LBS)</div>
        <div class="bar-chart">
          ${volData.map(d=>`<div class="bar-col">
            <div class="bar-inner" style="height:${Math.round((d.volume/maxVol)*72)+8}px"></div>
            <div class="bar-date">${d.date}</div>
          </div>`).join("")}
        </div>
      </div>`:""}
    <div class="card" style="margin-bottom:18px">
      <div style="font-size:10px;color:#555;letter-spacing:.12em;margin-bottom:12px">BODYWEIGHT (LBS)</div>
      <div class="bw-row">
        <input type="number" placeholder="Today's weight" id="bw-input" value="${state.bwInput}"/>
        <button class="btn btn-accent" style="white-space:nowrap;flex-shrink:0;padding:8px 14px;font-size:11px" onclick="logBW()">Log</button>
      </div>
      ${bwData.length>1?`
        <div style="position:relative;height:80px;margin-top:8px;overflow:hidden">
          <svg width="100%" height="80" viewBox="0 0 300 80" preserveAspectRatio="none">
            <polyline fill="none" stroke="#E8FF47" stroke-width="2"
              points="${bwData.map((d,i)=>`${(i/(bwData.length-1))*300},${80-((d.weight-minBW)/bwRange)*72}`).join(" ")}"/>
            ${bwData.map((d,i)=>`<circle cx="${(i/(bwData.length-1))*300}" cy="${80-((d.weight-minBW)/bwRange)*72}" r="3" fill="#E8FF47"/>`).join("")}
          </svg>
        </div>`:`<div style="font-size:11px;color:#555">Log daily to track trends.</div>`}
    </div>
    <div style="font-size:10px;color:#555;letter-spacing:.12em;margin-bottom:10px">RECENT SESSIONS</div>
    ${history.length>0?history.map(([date,entry])=>{
      const col=entry.type==="cardio"?"#47CFFF":"#E8FF47";
      const sets=Object.values(entry.sets||{}).reduce((a,sets)=>a+sets.filter(s=>s.done).length,0);
      return`<div class="session-row">
        <div>
          <div><span class="session-dot" style="background:${col}"></span><span class="session-name">${entry.workout}</span></div>
          <div class="session-meta">${sets} sets · ${date}</div>
        </div>
      </div>`;
    }).join(""):`<div style="font-size:11px;color:#555">No sessions yet.</div>`}`;
}

function render(){
  renderWeekStrip();
  if(state.tab==="plan")renderPlan();
  else if(state.tab==="log")renderLog();
  else if(state.tab==="nutrition")renderNutrition();
  else if(state.tab==="progress")renderProgress();
}

// ACTIONS
function setPlanView(v){state.planView=v;renderPlan();}
function toggleExpand(name){state.expandedPlan=state.expandedPlan===name?null:name;renderPlan();}

function startWorkout(name){
  const plan=PLANS[name];
  state.sessionSets={};
  plan.exercises.forEach(ex=>{
    state.sessionSets[ex.name]=Array.from({length:ex.sets},()=>({weight:"",reps:"",done:false}));
  });
  state.activeWorkout=name;
  switchTab("log");
}

function updateSet(ex,i,field,val){
  if(state.sessionSets[ex]&&state.sessionSets[ex][i])state.sessionSets[ex][i][field]=val;
}

function toggleSet(ex,i){
  if(state.sessionSets[ex]&&state.sessionSets[ex][i]){
    state.sessionSets[ex][i].done=!state.sessionSets[ex][i].done;
    renderLog();
  }
}

function toggleCardioSet(ex){
  if(state.sessionSets[ex]&&state.sessionSets[ex][0]){
    state.sessionSets[ex][0].done=!state.sessionSets[ex][0].done;
    renderLog();
  }
}

function updateCardioNote(ex,val){
  if(state.sessionSets[ex]&&state.sessionSets[ex][0])state.sessionSets[ex][0].reps=val;
}

function finishWorkout(){
  const dk=new Date().toISOString().split("T")[0];
  const plan=PLANS[state.activeWorkout];
  state.logs[dk]={workout:state.activeWorkout,type:plan.type,sets:JSON.parse(JSON.stringify(state.sessionSets))};
  state.activeWorkout=null;state.sessionSets={};
  save();showToast("Session saved! 💪");switchTab("progress");
}

function selFoodDay(d){state.selFoodDay=d;renderNutrition();}

function updateFoodEntry(field,val){state.foodEntry[field]=val;}

function addFood(){
  if(!state.foodEntry.food||!state.foodEntry.calories)return;
  const e={...state.foodEntry,id:Date.now(),calories:+state.foodEntry.calories,protein:+state.foodEntry.protein||0,carbs:+state.foodEntry.carbs||0,fat:+state.foodEntry.fat||0};
  if(!state.foodLogs[state.selFoodDay])state.foodLogs[state.selFoodDay]=[];
  state.foodLogs[state.selFoodDay].push(e);
  state.foodEntry={meal:state.foodEntry.meal,food:"",calories:"",protein:"",carbs:"",fat:""};
  save();showToast("Food logged!");renderNutrition();
}

function removeFood(day,id){
  state.foodLogs[day]=(state.foodLogs[day]||[]).filter(e=>e.id!==id);
  save();renderNutrition();
}

function logBW(){
  const input=document.getElementById("bw-input");
  const val=parseFloat(input.value);
  if(!val)return;
  const entry={date:new Date().toISOString().split("T")[0],weight:val};
  state.bodyweight=state.bodyweight.filter(e=>e.date!==entry.date);
  state.bodyweight.push(entry);
  state.bodyweight.sort((a,b)=>a.date.localeCompare(b.date));
  state.bwInput="";
  save();showToast("Weight logged!");renderProgress();
}

// NAV
document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click",()=>switchTab(btn.dataset.tab));
});

// INIT
load();render();
</script>
